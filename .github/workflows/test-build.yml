name: Test Build (no deploy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build
        run: |
          rm -rf dist
          npm run build

      - name: CSS manifest consistency check
        run: |
          echo "--- CSS files actually emitted to dist/client ---"
          ls -1 dist/client/assets/*.css 2>/dev/null | xargs -n1 basename
          echo ""
          echo "--- CSS names referenced inside dist/server ---"
          grep -rho 'styles-[A-Za-z0-9_-]*\.css' dist/server/ | sort -u
          echo ""
          EMITTED=$(ls -1 dist/client/assets/*.css | xargs -n1 basename | sort -u)
          REFD=$(grep -rho 'styles-[A-Za-z0-9_-]*\.css' dist/server/ | sort -u)
          if [ "$EMITTED" = "$REFD" ]; then echo "MATCH - server and client agree"; else echo "MISMATCH - server points at a file that does not exist"; fi

      - name: Compare new build vs live dist
        run: |
          echo "--- newly built dist ---"
          find dist -type f | sort
          echo ""
          echo "--- server entry present? ---"
          test -f dist/server/server.js && echo "YES dist/server/server.js" || echo "NO  dist/server/server.js  <-- wrangler needs this"
          test -d dist/client && echo "YES dist/client/" || echo "NO  dist/client/"
          echo ""
          echo "--- Supabase URL baked into client bundle? ---"
          grep -rho 'https://[a-z0-9]\{15,25\}\.supabase\.co' dist/client | sort -u || echo "none found"

      - uses: actions/upload-artifact@v4
        with:
          name: fresh-build
          path: dist/
