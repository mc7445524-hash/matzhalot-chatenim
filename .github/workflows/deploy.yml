name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Security gate - TanStack XSS (CVE-2026-102989)
        run: |
          MIN=1.169.39
          # Read the version out of every installed copy, not from `npm ls --json`
          # (its first "version" field is this project's own, which read as 1.0.0).
          FOUND=$(find node_modules -path '*@tanstack/start-server-core/package.json' \
                  -exec node -p "require('{}'.replace(/^/,process.cwd()+'/')).version" \; 2>/dev/null | sort -V -u)
          echo "installed copies of @tanstack/start-server-core:"
          echo "${FOUND:-  (none)}"
          [ -n "$FOUND" ] || { echo "package not installed - nothing to check"; exit 0; }
          OLDEST=$(echo "$FOUND" | head -1)
          LOWEST=$(printf '%s\n%s\n' "$OLDEST" "$MIN" | sort -V | head -1)
          [ "$LOWEST" = "$MIN" ] || { echo "VULNERABLE: $OLDEST is older than $MIN - refusing to deploy"; exit 1; }
          echo "OK - oldest installed copy is $OLDEST (>= $MIN)"

      - name: Build from source
        run: |
          rm -rf dist
          npm run build

      - name: Verify build output
        run: |
          test -f dist/server/server.js || { echo "missing dist/server/server.js"; exit 1; }
          test -d dist/client || { echo "missing dist/client"; exit 1; }
          grep -rq 'vggltzctdheulyunfjzn' dist/client || { echo "wrong or missing Supabase URL in client bundle"; exit 1; }
          echo "build output OK"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b3a00d289294f2a00926728f8db96d34

      - name: Smoke test the live site
        run: |
          URL=https://matzhalot.asher-weinberger.com
          sleep 15
          # Ask for an uncompressed body: Cloudflare otherwise serves brotli,
          # which curl saves verbatim and grep then refuses as a binary file.
          curl -fsSL --max-time 30 -H 'Accept-Encoding: identity' "$URL" -o /tmp/live.html \
            || { echo "site did not respond"; exit 1; }
          grep -aq "קול מצהלות חתנים" /tmp/live.html || { echo "page loaded but expected content is missing"; exit 1; }
          # Asset basenames change between framework versions, so match any script.
          JS=$(grep -ao '/assets/[A-Za-z0-9._-]*\.js' /tmp/live.html | head -1)
          [ -n "$JS" ] || { echo "no script referenced in HTML"; exit 1; }
          echo "checking $JS"
          curl -fsS --max-time 30 -o /dev/null "$URL$JS" || { echo "script $JS is missing (404)"; exit 1; }
          CSS=$(grep -ao '/assets/[A-Za-z0-9._-]*\.css' /tmp/live.html | head -1)
          if [ -n "$CSS" ]; then
            curl -fsS --max-time 30 -o /dev/null "$URL$CSS" \
              && echo "stylesheet $CSS OK" \
              || echo "::warning::stylesheet $CSS returns 404 - cosmetic flash on first paint, site still works"
          fi
          echo "SMOKE TEST PASSED - site is live and serving its assets"
